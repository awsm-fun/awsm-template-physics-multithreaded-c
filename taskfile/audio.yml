# The page's sound: builds the Rust crate in audio/ into dist/audio/.
#
# The same pipeline as the renderer's (taskfile/renderer.yml), minus the
# worker script: this module runs on the page itself, which imports
# dist/audio/audio.js directly.
#
#   cargo build     Rust  →  audio/target/wasm32-unknown-unknown/<profile>/audio.wasm
#   wasm-bindgen    that  →  dist/audio/audio_bg.wasm + audio.js (its JS glue)
#   wasm-opt        shrinks audio_bg.wasm in place (release only)
#   stamp           dist/audio.stamp, which tells the dev server to reload
#
# Two profiles, as for the renderer: `dev` (this crate unoptimized, its
# dependencies optimized, no wasm-opt; what `task dev` builds and rebuilds on
# every save) and `release` (what `task build` ships).
#
# The audio PROJECT (sounds, worklet modules) is data, not code: it lives in
# media/audio/ and `task media:build` copies it to dist/audio-project/.
version: "3"

vars:
  AUDIO_SRC: "{{.ROOT_DIR}}/audio"
  AUDIO_OUT: "{{.ROOT_DIR}}/dist/audio"
  AUDIO_STAMP: "{{.ROOT_DIR}}/dist/audio.stamp"
  AUDIO_TARGET: "{{.ROOT_DIR}}/audio/target/wasm32-unknown-unknown"

  # The post-MVP wasm features stable rustc emits for wasm32-unknown-unknown,
  # which wasm-opt must be told about. The same list, for the same reasons, as
  # RENDERER_WASM_FEATURES in taskfile/renderer.yml; keep the two in step.
  AUDIO_WASM_FEATURES: >-
    --enable-bulk-memory
    --enable-bulk-memory-opt
    --enable-call-indirect-overlong
    --enable-multivalue
    --enable-mutable-globals
    --enable-nontrapping-float-to-int
    --enable-reference-types
    --enable-sign-ext

tasks:
  dev:
    desc: "Audio: incremental dev build into dist/audio, then dist/audio.stamp"
    cmds:
      - task: cargo
        vars: { ARGS: "build" }
      - task: bindgen-dev
      - task: finish
        vars: { PROFILE: dev }

  release:
    desc: "Audio: optimized build into dist/audio, then dist/audio.stamp"
    preconditions:
      - sh: command -v wasm-opt >/dev/null
        msg: "wasm-opt not found. It is part of Binaryen: `brew install binaryen` (macOS) or `apt install binaryen` (Linux)."
    cmds:
      - task: cargo
        vars: { ARGS: "build --release" }
      - task: bindgen
        vars: { PROFILE: release }
      # -Os like the crate's own release profile: the page downloads this on
      # every cold visit, and the per-cue work it does is small.
      - >-
        wasm-opt -Os {{.AUDIO_WASM_FEATURES}}
        "{{.AUDIO_OUT}}/audio_bg.wasm"
        -o "{{.AUDIO_OUT}}/audio_bg.wasm"
      - task: finish
        vars: { PROFILE: release }

  check:
    desc: "Audio: cargo check, clippy with warnings as errors, and a formatting check"
    dir: "{{.AUDIO_SRC}}"
    cmds:
      - task: cargo
        vars: { ARGS: "check" }
      - task: cargo
        vars: { ARGS: "clippy -- -D warnings" }
      - cargo fmt --check

  fmt:
    desc: "Audio: format the Rust sources"
    dir: "{{.AUDIO_SRC}}"
    cmds:
      - cargo fmt

  clean:
    desc: "Audio: remove cargo's target directory and the built files in dist"
    cmds:
      - rm -rf "{{.AUDIO_SRC}}/target" "{{.AUDIO_OUT}}" "{{.AUDIO_STAMP}}"

  # ── building blocks ────────────────────────────────────────────────────────

  # Runs `cargo {{.ARGS}}` in audio/. Unlike the renderer, nothing here
  # compiles C, so no wasm-capable clang is needed, and no dependency uses
  # web-sys's unstable APIs, so no `--cfg` either.
  cargo:
    internal: true
    dir: "{{.AUDIO_SRC}}"
    requires:
      vars: [ARGS]
    cmds:
      # CARGO_TARGET_DIR: the release task reads cargo's output from
      # audio/target; pin it there even if the caller redirects cargo's
      # target directory globally.
      - >-
        CARGO_TARGET_DIR="{{.AUDIO_SRC}}/target"
        cargo {{.ARGS}}

  # Turns cargo's .wasm into what the page imports: `audio_bg.wasm` plus
  # `audio.js`, an ES module (`--target web`) whose default export
  # instantiates the wasm and whose named exports are the Rust API.
  bindgen:
    internal: true
    requires:
      vars: [PROFILE]
    vars:
      BINDGEN_VERSION:
        sh: sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' "{{.AUDIO_SRC}}/Cargo.lock"
    preconditions:
      - sh: test "$(wasm-bindgen --version 2>/dev/null | cut -d' ' -f2)" = "{{.BINDGEN_VERSION}}"
        msg: |
          The wasm-bindgen CLI must be exactly the `wasm-bindgen` version in
          audio/Cargo.lock:
              cargo install wasm-bindgen-cli --locked --version {{.BINDGEN_VERSION}}
    cmds:
      # From here until `finish`, dist/audio is half-written: without a
      # stamp, nothing can mistake it for a finished build.
      - rm -f "{{.AUDIO_STAMP}}"
      - mkdir -p "{{.AUDIO_OUT}}"
      - >-
        wasm-bindgen --target web --no-typescript
        --out-name audio
        --out-dir "{{.AUDIO_OUT}}"
        "{{.AUDIO_TARGET}}/{{.PROFILE}}/audio.wasm"

  # The dev build's wasm-bindgen step, skipped when dist/ already holds the
  # output of this very dev build (see the same task in taskfile/renderer.yml).
  bindgen-dev:
    internal: true
    status:
      - grep -q '^dev ' "{{.AUDIO_STAMP}}"
      - test "{{.AUDIO_OUT}}/audio_bg.wasm" -nt "{{.AUDIO_TARGET}}/debug/audio.wasm"
    cmds:
      - task: bindgen
        vars: { PROFILE: debug }

  # Writes the stamp ("<profile> <when>"). Last on purpose: the dev server
  # watches it, and must only reload the page once every file of the build is
  # in place.
  finish:
    internal: true
    requires:
      vars: [PROFILE]
    cmds:
      - echo "{{.PROFILE}} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "{{.AUDIO_STAMP}}"
