# Stable Rust is enough: like the renderer, this is an ordinary
# single-threaded wasm module. It runs on the page's main thread and never
# touches the shared memory, so it needs none of the nightly machinery
# (build-std, atomics) that Rust wasm threads require.
[toolchain]
channel = "stable"
targets = ["wasm32-unknown-unknown"]
components = ["clippy", "rustfmt"]
